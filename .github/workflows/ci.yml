name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: black
        run: black --check --diff src tests
      - name: isort
        run: isort --check-only --diff src tests
      - name: flake8
        run: flake8 src tests --max-line-length=88 --extend-ignore=E203,W503
      - name: mypy
        run: mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Coverage is instrumented on the one cell that uploads it. The
      # other eleven ran the same instrumentation and threw the report
      # away, which bought nothing and slowed every cell.
      #
      # The slow geometric tests are NOT deselected outside that cell.
      # They are what the matrix exists to catch: they are sensitive to
      # floating point, and running them on one platform would defeat
      # the point of having three.
      #
      # --doctest-modules runs alongside coverage rather than
      # everywhere, so that a docstring example is executed on every push
      # without changing what a bare `pytest` does locally. Both paths are
      # named: a bare `--doctest-modules src` would override the testpaths
      # setting and collect the four doctests and nothing else, which
      # passes green while running none of the suite.
      #
      # --cov-branch and --cov-fail-under are what make the 100 per cent
      # a standard rather than a habit. Without the first, branch
      # coverage was never measured at all; without the second, coverage
      # was collected, uploaded and allowed to fall with nothing going
      # red. The threshold lives here and not in pyproject.toml on
      # purpose: a partial local run under --cov must not trip it, and
      # only this step runs the whole suite.
      - name: pytest
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: pytest
      - name: pytest with coverage and doctests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          pytest --doctest-modules src tests --cov=itacart --cov-branch
          --cov-fail-under=100 --cov-report=xml --cov-report=term-missing
      #
      # The token is required even though the repository is public: v4 of
      # the action dropped tokenless uploading, keeping it only for pull
      # requests opened from a fork against an upstream public repository.
      # Without it the upload fails and says so in the log alone. The
      # secret belongs to the canonical repository, because that is the
      # one the badge reads; where it is absent the expression is empty
      # and the step behaves as it did before, which is to say it fails
      # quietly and changes nothing.
      #
      # fail_ci_if_error is left at its default. The coverage standard is
      # enforced by --cov-fail-under above, which runs in this job and
      # cannot be satisfied by an upload; making the matrix depend on a
      # third party's availability would turn an outage into a red build
      # that says nothing about the package.
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: OGC DGGS Core / EAERS conformance suite
        run: pytest -m conformance -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
