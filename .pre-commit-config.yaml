# Local quality gate, mirroring the lint job of the CI workflow.
# Discipline: CONTRIBUTING.md, "Code discipline".
#
# Installation:
#     pip install pre-commit
#     pre-commit autoupdate      # pin the current releases
#     pre-commit install
#     pre-commit run --all-files # first pass, formats whatever is pending
#
# The revisions below are a starting point. Run `pre-commit autoupdate`
# before first use so that they reflect what is published today.

default_language_version:
  python: python3.12

# Hooks run when committing unless they say otherwise. Without this line every
# hook also runs on `git push` once the pre-push hook type is installed, which
# the test hook below needs, and the formatters then run against whatever the
# working tree holds at push time, generated files included.
default_stages: [pre-commit]

repos:
  # -- Basic file hygiene ---------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: debug-statements

  # -- Formatting -----------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.0b5
    hooks:
      - id: isort

  # -- Lint -----------------------------------------------------------------
  # If the repository ever gains a .flake8 or a setup.cfg with [flake8],
  # DELETE the `args` block below: two sources of configuration drift apart
  # in silence.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]

  # -- Types ----------------------------------------------------------------
  # Mirrors `mypy src`. Restricted to src/ on purpose: the tests are checked
  # separately and should not block a commit of source code.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--strict]
        files: ^src/
        additional_dependencies:
          - shapely>=2.0

  # -- Tests ----------------------------------------------------------------
  # This ran in under a second when it was written. If it grows slow, move it
  # to `stages: [pre-push]` or drop this block.
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (tests/unit)
        entry: pytest tests/unit -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
