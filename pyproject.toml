[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itacart"
version = "0.1.0a4"
authors = [
  { name = "ITACaRT", email = "itacart@proton.me" },
]
maintainers = [
  { name = "Israel Nunes da Silva", email = "israelnunes@ita.br" },
]
description = "An Equal-Area Parallelogram DGGS for Terrestrial Cadastral Mapping-Designed for Usability and Blockchain Integration."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["dggs", "gis", "geospatial", "cadastre", "blockchain", "sdi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Runtime: shapely is the sole hard dependency.
# PROJ is absent from every extra as well as from the runtime. The
# ellipsoidal sinusoidal projection is implemented from equations (1) and
# (2) of the paper, and the geodesic solutions are checked against a
# Runge-Kutta integration of the geodesic equations and against Clairaut's
# relation, not against a second library that would have to be trusted.
dependencies = [
    "shapely>=2.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14"]          # interop.to_geodataframe
parallel = ["joblib>=1.3"]         # polyfill with n_jobs > 1
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.9",
    "geopandas>=0.14",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
docs = [
    "sphinx>=7.0,<10",
    "sphinx-rtd-theme>=3.1",
    "sphinx-autodoc-typehints>=2.0",
    "myst-nb>=1.2",          # MyST + execution; pulls myst-parser
    "sphinx-copybutton>=0.5",
]

[project.urls]
Homepage = "https://github.com/ICartCWB/itacart"
Documentation = "https://itacart.github.io/itacart/"
Repository = "https://github.com/ICartCWB/itacart"
Issues = "https://github.com/ICartCWB/itacart/issues"
Paper = "https://doi.org/10.14393/rbcv77n0a-79281"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itacart = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["itacart"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
markers = [
    "conformance: OGC DGGS Core / EAERS conformance tests",
    "slow: tests that take more than a second",
    "crosscheck: tests validating against an independent solution method",
]

[tool.coverage.report]
# The "raise NotImplementedError" exclusion is gone, with the ten lines it
# excused. It removed them from the denominator rather than showing them
# as a miss, which is why its removal belonged to the phase that
# implemented engine.py rather than to any earlier one: deleting it while
# a stub survived would have turned the threshold red for a reason nobody
# had chosen. test_totality.py asserts that no such line exists anywhere
# in the package, so the exclusion cannot come back unnoticed either.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
